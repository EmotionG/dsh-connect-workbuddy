<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>composer credits mock</title>
<style>
  :root{
    --bg:#f4f4f5; --panel:#ffffff; --line:#e4e4e7; --line2:#d4d4d8;
    --ink:#18181b; --ink2:#52525b; --ink3:#a1a1aa; --green:#16a34a;
    --font:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:21px}
  .wrap{width:470px;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .head h2{margin:0;font-size:15px}
  .btn{padding:5px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);color:var(--ink2);font:inherit;font-size:12px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--ink3);font-size:12px;font-weight:500;padding:4px 0;border-bottom:1px solid var(--line)}
  th:last-child,td:last-child{text-align:right}
  td{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  tr:last-child td{border-bottom:0}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:0}
  .dot.g{background:var(--green)} .dot.n{background:#d4d4d8}
  .num{font-weight:700;font-size:14px}
  .foot{color:var(--ink3);font-size:12px;margin:10px 0 0}
  .readout{margin:14px 2px 0;color:var(--ink2);font-size:14px}
  .cap{margin:16px 0 0;color:var(--ink3);font-size:11px;text-align:center}
</style></head><body>
<div class="wrap">
  <div class="panel">
    <div class="head"><h2>WB CN 积分</h2><span class="btn">一键测试</span></div>
    <table>
      <thead><tr><th>账号</th><th>积分</th></tr></thead>
      <tbody>
        <tr><td><span class="dot g"></span>示例账号 A</td><td class="num">3,351</td></tr>
        <tr><td><span class="dot n"></span>示例账号 B</td><td class="num">2,436</td></tr>
        <tr><td><span class="dot n"></span>示例账号 C</td><td class="num">1,953</td></tr>
        <tr><td><span class="dot n"></span>示例账号 D</td><td class="num">432</td></tr>
      </tbody>
    </table>
    <p class="foot">最近刷新 16:04</p>
  </div>
  <div class="readout">WB CN · 3,351</div>
  <p class="cap">合成数据 · 仅用于说明界面结构 · dsh-connect-workbuddy</p>
</div>
</body></html>
